name: Commit and Push Changes

on:
  push:
    branches:
      - main


env:
    OUT_FILENAME: "REUSABLE_LATEST_VERSIONS.md"

jobs:
  commit-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make changes
        run: |
          printf "# Latest Versions \n" > ${{ env.OUT_FILENAME }}
          printf "| Workflow | Hash | Full Path |\n" >> ${{ env.OUT_FILENAME }}
          printf "| :-- | :-- | :-- |\n" >> ${{ env.OUT_FILENAME }}
          for rev in $(ls .github/workflows -I create-readme.yml ); do
            hash=$(git rev-list --all --max-count=1 .github/workflows/$rev)
            printf "| $rev | $hash | felamanagementag/fela-tools/.github/workflows/$ref@$hash |\n" >> ${{ env.OUT_FILENAME }}
          done

      - name: Commit changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Automatischer Commit durch GitHub Actions"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin main
