name: Create Workflow Latest Hash Readme

on:
  push:
    branches:
      - main


env:
  OUT_FILENAME: "REUSABLE_LATEST_VERSIONS.md"

jobs:
  create-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create File
        run: |
          printf "# Latest Versions \n" > ${{ env.OUT_FILENAME }}
          printf "| Workflow | Hash | Full Path |\n" >> ${{ env.OUT_FILENAME }}
          printf "| :-- | :-- | :-- |\n" >> ${{ env.OUT_FILENAME }}
          for rev in $(ls .github/workflows -I create-last-hashes.yml -I create-readme.yml ); do
            hash=$(cd .github/workflows && git rev-list --all --max-count=1 $rev)
            printf "| $rev | $hash | ${{ github.repository }}/.github/workflows/$rev@$hash |\n" >> ${{ env.OUT_FILENAME }}
          done

      - name: Show File
        run: cat ${{ env.OUT_FILENAME }}

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: Workflow-Version-Overview
          path: ${{ env.OUT_FILENAME }}
  
  
      - name: Setup Git & Commit
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Automatischer Commit durch GitHub Actions"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin main
